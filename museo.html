<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Museo de OCs — Iván Gómez Navarro</title>

  <!-- Tema: se aplica antes del CSS (igual que en index.html) -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('ign-theme');
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="museo.css">
</head>
<body>

  <!-- ===== BARRA SUPERIOR (HUD, fuera del entorno 3D) ===== -->
  <div class="hud" id="hud">
    <p class="hud-help">
      <b>WASD / flechas</b> para caminar ·
      <b>Click derecho mantenido</b> + ratón para mirar ·
      <b>Click izquierdo</b> sobre un cuadro para ver su ficha
    </p>
    <button class="hud-back" id="hud-back" type="button">← Volver a la web</button>
  </div>

  <!-- ===== ESCENA 3D (la habitación se construye en JS) ===== -->
  <div class="viewport" id="viewport">
    <div class="world" id="world"><!-- paredes generadas por JS --></div>
    <div class="crosshair" aria-hidden="true"></div>
  </div>

  <!-- ===== NOTA INFORMATIVA (imagen a pantalla) ===== -->
  <div class="note" id="note" role="dialog" aria-modal="true" aria-labelledby="note-title" hidden>
    <div class="note-card">
      <div class="note-media"><img id="note-img" alt=""></div>
      <div class="note-text">
        <h2 id="note-title"></h2>
        <p id="note-desc"></p>
      </div>
      <button class="note-close" id="note-close" type="button">Cerrar</button>
    </div>
  </div>

  <!-- Aviso de orientación (solo móvil en vertical, como un juego) -->
  <div id="rotate-overlay" role="dialog" aria-label="Gira el dispositivo">
    <svg class="ro-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <rect x="7" y="2.5" width="10" height="19" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <line x1="10" y1="19" x2="14" y2="19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M2.5 12a9.5 9.5 0 0 1 16.2-6.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M18.7 1.8v3.7h-3.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p>Gira el móvil para empezar</p>
  </div>

  <script src="museo.js"></script>
</body>
</html>
